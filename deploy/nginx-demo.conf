# Managed by tikhoe-demo installer. Preview only; configure HTTPS before public launch.
server {
    listen 80;
    server_name 90.156.135.117 vm754126.vps.masterhost.tech;
    server_tokens off;
    client_max_body_size 10m;
    auth_basic "Tikhoe preview";
    auth_basic_user_file /etc/nginx/tikhoe-demo.htpasswd;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Management is unavailable on the temporary HTTP preview.
    location ~ ^/(admin|api/(admin|login|logout))(/|$) {
        return 403;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Authorization "";
        proxy_buffering off;
        proxy_read_timeout 60s;
    }
}
